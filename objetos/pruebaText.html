<body>
    <label for="miInputJS">Solo números y *:</label>
    <input type="text" id="miInputJS" onkeypress="return soloNumerosYAsterisco(event);" />

    <script>
        function soloNumerosYAsterisco(event) {
            const charCode = (event.which) ? event.which : event.keyCode;
            // Códigos ASCII: 48-57 para 0-9, 42 para *
            if ((charCode >= 48 && charCode <= 57) || charCode === 42 || charCode === 8 || charCode === 0 || charCode === 46) { // 8 es Backspace
                return true;
            }
            return false;
        }

    </script>
    <script>
        document.getElementById('formValidacion').addEventListener('submit', function(event) {
            // 1. Previene el envío normal del formulario (la recarga de página)
            event.preventDefault();

            const inputElement = document.getElementById('mi_input');
            const respuestaElement = document.getElementById('respuestaServidor');
            const valorInput = inputElement.value;

            // Opcional: Validación JS inicial (buena práctica)
            if (!/^[0-9*]+$/.test(valorInput)) {
                respuestaElement.textContent = "Error (JS): Solo se permiten números y *";
                respuestaElement.style.color = "orange";
                return;
            }

            // 2. Envía los datos al servidor usando fetch (AJAX)
            fetch('validar.php', {
                    method: 'POST',
                    headers: {
                        // Le decimos a PHP que le enviamos datos de formulario
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    // Codificamos el dato clave=valor como si fuera un formulario normal
                    body: 'mi_input=' + encodeURIComponent(valorInput)
                })
                .then(response => response.text()) // Esperamos una respuesta de texto plano
                .then(data => {
                    // 3. Manejamos la respuesta del servidor
                    if (data.includes('Dato válido')) {
                        respuestaElement.textContent = data;
                        respuestaElement.style.color = "green";
                    } else {
                        respuestaElement.textContent = data;
                        respuestaElement.style.color = "red";
                    }
                })
                .catch(error => {
                    console.error('Error en la petición:', error);
                    respuestaElement.textContent = 'Hubo un error de conexión.';
                    respuestaElement.style.color = "red";
                });
        });

    </script>
</body>

</html>
