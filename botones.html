    <style>
        .green-button {
            background-color: #2f7f6a;
            /* verde principal */
            border: none;
            border-radius: 16px;
            padding: 14px 18px;
            color: #ffffff;
            cursor: pointer;

            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;

            font-family: system-ui, sans-serif;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .green-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.25);
        }

        .green-button .icon {
            font-size: 28px;
            line-height: 1;
        }

        .green-button .text {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
        }

    </style>
</head>

        <div class="icon">
