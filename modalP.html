<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal de Venta - Programador Senior</title>
    <!-- Font Awesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* Estilos generales */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .btn-open {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: background 0.3s;
        }

        .btn-open:hover {
            background: #1a252f;
        }

        /* Modal overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        /* Modal content - ocupa el 40% del ancho de la página como se indica */
        .modal-content {
            background: white;
            width: 90%;
            max-width: 500px;
            /* Aproximadamente 40% en pantallas grandes */
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 24px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e0e0e0;
            padding-bottom: 12px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.5rem;
            color: #333;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #888;
        }

        .close-btn:hover {
            color: #333;
        }

        /* Grupos de formulario */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #2c3e50;
        }

        /* Estilo de inputs searchables (con datalist) */
        .searchable-input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            transition: border 0.2s;
        }

        .searchable-input:focus {
            border-color: #3498db;
            outline: none;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.1);
        }

        /* Botones de método de pago */
        .payment-methods {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .payment-btn {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            color: #555;
            cursor: pointer;
            transition: all 0.2s;
            min-width: 120px;
        }

        .payment-btn i {
            font-size: 20px;
        }

        .payment-btn.active {
            border-color: #27ae60;
            background: #e8f5e9;
            color: #27ae60;
        }

        .payment-btn.credit.active {
            border-color: #e67e22;
            background: #fff3e0;
            color: #e67e22;
        }

        /* Sección de cantidad a pagar / adelanto */
        .amount-section {
            background: #f9f9f9;
            border-radius: 12px;
            padding: 16px;
            margin-top: 10px;
            border-left: 4px solid #3498db;
        }

        .amount-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            flex-wrap: wrap;
        }

        .amount-row label {
            font-weight: 500;
            min-width: 120px;
        }

        .amount-row input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        .total-display {
            font-size: 1.2rem;
            font-weight: 700;
            color: #2c3e50;
            background: #eef2f7;
            padding: 8px 12px;
            border-radius: 6px;
            margin: 10px 0;
        }

        .advance-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 10px 0;
            cursor: pointer;
        }

        .advance-checkbox input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .advance-input {
            margin-top: 10px;
            display: none;
        }

        .advance-input.show {
            display: block;
        }

        /* Botón de acción final */
        .btn-submit {
            width: 100%;
            background: #2c3e50;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background: #1a252f;
        }

    </style>
</head>

<body>
    <button class="btn-open" id="openModalBtn">Abrir Modal de Venta</button>

    <!-- Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Seleccione Vendedor/Cajero</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>

            <form id="ventaForm">
                <!-- Vendedor searchable -->
                <div class="form-group">
                    <label for="vendedor">Vendedor / Cajero</label>
                    <input type="text" id="vendedor" class="searchable-input" list="vendedoresList" placeholder="Escriba para buscar...">
                    <datalist id="vendedoresList">
                        <option value="Juan Perez">
                        <option value="Maria Lopez">
                        <option value="Carlos Gomez">
                        <option value="Ana Martinez">
                        <option value="Pedro Ramirez">
                    </datalist>
                </div>

                <!-- Cliente searchable con opción rápida "Público en General" -->
                <div class="form-group">
                    <label for="cliente">Cliente</label>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <input type="text" id="cliente" class="searchable-input" list="clientesList" placeholder="Escriba o seleccione..." style="flex: 1;">
                        <button type="button" id="publicoGeneralBtn" style="background: #ecf0f1; border: none; border-radius: 6px; padding: 8px 12px; cursor: pointer; white-space: nowrap;">
                            <i class="fas fa-users"></i> Público Gral.
                        </button>
                    </div>
                    <datalist id="clientesList">
                        <option value="Público en General">
                        <option value="Cliente A (Empresa)">
                        <option value="Cliente B (Particular)">
                        <option value="Corporación X">
                        <option value="Distribuidora Y">
                        <option value="Persona Z">
                    </datalist>
                </div>

                <!-- Métodos de pago con iconos -->
                <div class="form-group">
                    <label>Método de Pago</label>
                    <div class="payment-methods">
                        <button type="button" class="payment-btn" id="cashBtn">
                            <i class="fas fa-money-bill-wave"></i> Efectivo
                        </button>
                        <button type="button" class="payment-btn credit" id="creditBtn">
                            <i class="fas fa-credit-card"></i> Crédito/Tarjeta
                        </button>
                    </div>
                </div>

                <!-- Sección dinámica de cantidad/adelanto -->
                <div class="amount-section" id="amountSection" style="display: none;">
                    <!-- Aquí se inyectará contenido según método seleccionado -->
                </div>

                <button type="submit" class="btn-submit">Procesar Venta</button>
            </form>
        </div>
    </div>

    <script>
        (function() {
            // Elementos del DOM
            const modalOverlay = document.getElementById('modalOverlay');
            const openModalBtn = document.getElementById('openModalBtn');
            const closeModalBtn = document.getElementById('closeModalBtn');
            const cashBtn = document.getElementById('cashBtn');
            const creditBtn = document.getElementById('creditBtn');
            const amountSection = document.getElementById('amountSection');
            const publicoGeneralBtn = document.getElementById('publicoGeneralBtn');
            const clienteInput = document.getElementById('cliente');
            const form = document.getElementById('ventaForm');

            // Variables de estado
            let selectedMethod = null; // 'cash' o 'credit'
            let totalVenta = 150.00; // Ejemplo de total (podría venir de otro lado)

            // Abrir modal
            openModalBtn.addEventListener('click', () => {
                modalOverlay.style.display = 'flex';
                // Resetear a estado inicial
                resetModal();
            });

            // Cerrar modal
            const closeModal = () => {
                modalOverlay.style.display = 'none';
            };
            closeModalBtn.addEventListener('click', closeModal);
            modalOverlay.addEventListener('click', (e) => {
                if (e.target === modalOverlay) closeModal();
            });

            // Botón "Público en General"
            publicoGeneralBtn.addEventListener('click', () => {
                clienteInput.value = 'Público en General';
            });

            // Manejo de métodos de pago
            cashBtn.addEventListener('click', () => {
                setActiveMethod('cash');
                updateAmountSection();
            });

            creditBtn.addEventListener('click', () => {
                setActiveMethod('credit');
                updateAmountSection();
            });

            function setActiveMethod(method) {
                selectedMethod = method;
                cashBtn.classList.remove('active');
                creditBtn.classList.remove('active');
                if (method === 'cash') {
                    cashBtn.classList.add('active');
                } else {
                    creditBtn.classList.add('active');
                }
            }

            // Actualizar la sección de cantidad según el método
            function updateAmountSection() {
                if (!selectedMethod) {
                    amountSection.style.display = 'none';
                    return;
                }

                amountSection.style.display = 'block';
                let html = '';

                if (selectedMethod === 'cash') {
                    html = `
                        <div class="amount-row">
                            <label><i class="fas fa-money-bill-wave"></i> Cantidad a pagar:</label>
                            <input type="number" id="cashAmount" step="0.01" min="0" value="${totalVenta}" placeholder="0.00">
                        </div>
                        <div class="total-display">Total de venta: $${totalVenta.toFixed(2)}</div>
                    `;
                } else if (selectedMethod === 'credit') {
                    html = `
                        <div class="total-display">Total a crédito: $${totalVenta.toFixed(2)}</div>
                        <div class="advance-checkbox">
                            <input type="checkbox" id="advanceCheckbox">
                            <label for="advanceCheckbox">¿Adelantar pago?</label>
                        </div>
                        <div class="advance-input" id="advanceInputContainer">
                            <div class="amount-row">
                                <label><i class="fas fa-hand-holding-usd"></i> Monto a adelantar:</label>
                                <input type="number" id="advanceAmount" step="0.01" min="0" max="${totalVenta}" value="0.00" placeholder="0.00">
                            </div>
                        </div>
                    `;
                }

                amountSection.innerHTML = html;

                // Si es crédito, agregar funcionalidad al checkbox
                if (selectedMethod === 'credit') {
                    const advanceCheckbox = document.getElementById('advanceCheckbox');
                    const advanceContainer = document.getElementById('advanceInputContainer');
                    if (advanceCheckbox) {
                        advanceCheckbox.addEventListener('change', function(e) {
                            if (this.checked) {
                                advanceContainer.classList.add('show');
                            } else {
                                advanceContainer.classList.remove('show');
                            }
                        });
                    }
                }
            }

            // Reset del modal al cerrar
            function resetModal() {
                // Limpiar inputs
                document.getElementById('vendedor').value = '';
                clienteInput.value = '';
                // Quitar método activo
                selectedMethod = null;
                cashBtn.classList.remove('active');
                creditBtn.classList.remove('active');
                amountSection.style.display = 'none';
                amountSection.innerHTML = '';
            }

            // Manejar envío del formulario (solo muestra datos en consola)
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const vendedor = document.getElementById('vendedor').value;
                const cliente = clienteInput.value;

                if (!vendedor || !cliente) {
                    alert('Por favor seleccione vendedor y cliente.');
                    return;
                }
                if (!selectedMethod) {
                    alert('Seleccione un método de pago.');
                    return;
                }

                let pagoInfo = {};
                if (selectedMethod === 'cash') {
                    const cashAmount = document.getElementById('cashAmount')?.value || totalVenta;
                    pagoInfo = {
                        metodo: 'Efectivo',
                        cantidad: parseFloat(cashAmount)
                    };
                } else {
                    const advanceCheck = document.getElementById('advanceCheckbox')?.checked || false;
                    const advanceAmount = advanceCheck ? (document.getElementById('advanceAmount')?.value || 0) : 0;
                    pagoInfo = {
                        metodo: 'Crédito',
                        total: totalVenta,
                        adelanto: advanceCheck ? parseFloat(advanceAmount) : 0,
                        saldo: totalVenta - (advanceCheck ? parseFloat(advanceAmount) : 0)
                    };
                }

                console.log('Venta procesada:', {
                    vendedor,
                    cliente,
                    ...pagoInfo
                });

                alert('Venta registrada (ver consola).');
                closeModal();
            });

            // Cerrar con tecla ESC
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalOverlay.style.display === 'flex') {
                    closeModal();
                }
            });
        })();

    </script>
</body>

</html>
